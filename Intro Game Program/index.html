    <script>
        // Engine-specific
        
        // Engine-specific
   

        //Game-specific
        //Starting position of my character
        let position = new Vector2()
        let position2 = new Vector2()

        function start() {
            position.x = 0
            position.y = 0

            position2.x = 100
            position2.y = 100

            gameLoop()
        }

        //Engine-specific
        function gameLoop() {
            update()
            draw()
            requestAnimationFrame(gameLoop)
        }

        //Engine-specific
        function update() {
            //Game-specific
            position.x++
            position.y++

            position2.x++
            position2.y++
        }

        function draw() {

            canvas.width = window.innerWidth
            canvas.height = window.innerHeight



            //Draw the first character
            ctx.save()
            ctx.translate(position.x, position.y)

            ctx.beginPath()
            ctx.moveTo(110, 90)
            ctx.lineTo(145, 100)
            ctx.lineTo(145, 90)
            ctx.lineTo(155, 90)
            ctx.lineTo(155, 100)
            ctx.lineTo(190, 90)
            ctx.lineTo(200, 140)
            ctx.lineTo(175, 150)
            ctx.lineTo(150, 140)
            ctx.lineTo(125, 150)
            ctx.lineTo(100, 140)
            ctx.lineTo(110, 90)


            ctx.lineWidth = 5
            ctx.strokeStyle = "purple"
            ctx.stroke()

            ctx.fillStyle = "red"
            ctx.fill()
            ctx.restore()

            //Draw the second character
            ctx.save()
            ctx.translate(position2.x, position2.y)

            ctx.beginPath()
            ctx.moveTo(110, 90)
            ctx.lineTo(145, 100)
            ctx.lineTo(145, 90)
            ctx.lineTo(155, 90)
            ctx.lineTo(155, 100)
            ctx.lineTo(190, 90)
            ctx.lineTo(200, 140)
            ctx.lineTo(175, 150)
            ctx.lineTo(150, 140)
            ctx.lineTo(125, 150)
            ctx.lineTo(100, 140)
            ctx.lineTo(110, 90)


            ctx.lineWidth = 5
            ctx.strokeStyle = "teal"
            ctx.stroke()

            ctx.fillStyle = "orange"
            ctx.fill()
            ctx.restore()

        }

        // start()
        SceneManager.currentScene = new Start_Scene()
        Engine.start({
            aspectRatio: 2,
            layers: ["background", "foreground"],
             collisionLayers: [
            ["background", "foreground"],
            ["foreground", "foreground"]  // ← add this
    ]
        })
    </script>
